<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"linea","type":"string","label":"Frase de cierre","default":"Lo pruebas antes de pagar","maxLength":50}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>DropAudio CCS · Escena CTA</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Plus Jakarta Sans"; src: url("fonts/plus-jakarta-sans-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Plus Jakarta Sans"; src: url("fonts/plus-jakarta-sans-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #090807; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #090807; color: #f0ede8; font-family: "Plus Jakarta Sans", sans-serif; }
      .capa { position: absolute; inset: 0; }
      /* Acabado (pseudo-elementos para no tapar el texto ante el auditor): viñeta y grano */
      #fondo { background: radial-gradient(120% 75% at 50% 45%, #1c160d 0%, #0c0b09 55%, #090807 100%); }
      #resplandor { position: absolute; left: 90px; top: 560px; width: 900px; height: 900px; border-radius: 50%; background: #cda860; opacity: 0.18; filter: blur(190px); }
      .polvo { position: absolute; border-radius: 50%; background: #e7c98a; }
      #root::after { content: ""; position: absolute; inset: 0; z-index: 10; pointer-events: none; background: radial-gradient(95% 70% at 50% 48%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.78) 100%); }
      #root::before { content: ""; position: absolute; inset: -40px; z-index: 11; pointer-events: none; opacity: 0.07; mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
      #escenario { position: absolute; left: 70px; right: 70px; top: 300px; bottom: 400px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      #marca { display: flex; align-items: center; gap: 22px; font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 64px; letter-spacing: -0.035em; }
      #marca svg { width: 92px; height: 92px; display: block; overflow: visible; }
      #marca .p { color: #cda860; }
      #linea { margin-top: 70px; max-width: 920px; font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 104px; line-height: 1.02; letter-spacing: -0.045em; color: #f0ede8; }
      #linea-raya { width: 200px; height: 8px; border-radius: 4px; margin-top: 44px; background: #cda860; }
      #cta { position: relative; margin-top: 70px; width: 940px; padding: 46px 40px 50px; border-radius: 44px; border: 4px solid #cda860; background: linear-gradient(160deg, rgba(205,168,96,0.16), rgba(205,168,96,0.04)); box-shadow: 0 40px 100px rgba(0,0,0,0.55), 0 0 60px rgba(205,168,96,0.12); overflow: hidden; }
      #cta-a { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 92px; line-height: 1.0; letter-spacing: -0.04em; }
      #cta-a .clave { color: #e2be72; }
      #cta-b { margin-top: 22px; font-size: 44px; line-height: 1.25; font-weight: 600; color: #e6e0d6; }
      #cta-b b { font-weight: 700; color: #f0ede8; white-space: nowrap; }
      #cta-brillo { position: absolute; top: -30%; left: 0; width: 26%; height: 160%; background: linear-gradient(100deg, rgba(255,244,220,0) 0%, rgba(255,244,220,0.22) 50%, rgba(255,244,220,0) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="fondo" class="capa"><div id="resplandor"></div><div id="polvo" class="capa"></div></div>

      <div id="escenario">
        <div id="marca">
          <svg viewBox="0 0 24 24" fill="none" stroke="#cda860" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path id="onda" d="M2 12h3l2-6 4 14 4-18 3 10h4" /></svg>
          <span id="marca-txt">DropAudio<span class="p">·</span>CCS</span>
        </div>
        <div id="linea" data-var-text="linea">Lo pruebas antes de pagar</div>
        <div id="linea-raya"></div>
        <div id="cta">
          <div id="cta-brillo" data-layout-allow-overflow></div>
          <div id="cta-a">Comenta <span class="clave">ASESORÍA</span></div>
          <div id="cta-b">o escríbenos al <b>0422-1609357</b></div>
        </div>
      </div>

    </div>

    <script>
      // La duración total sale del data-duration del root (Reel Studio lo reescribe antes de renderizar).
      const root = document.getElementById("root");
      const D = Math.max(3, parseFloat(root.dataset.duration) || 6);
      const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
      const linea = String(V.linea != null ? V.linea : "Lo pruebas antes de pagar");

      function prng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
      // Reduce el tamaño de letra hasta que el texto quepa en maxLineas (mide sin padding ni borde; solo al armar).
      function ajustar(el, px, minPx, maxLineas, lh) {
        const alto = () => {
          const cs = getComputedStyle(el);
          return el.getBoundingClientRect().height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - parseFloat(cs.borderTopWidth) - parseFloat(cs.borderBottomWidth);
        };
        el.style.fontSize = px + "px";
        while (px > minPx && alto() > px * lh * maxLineas + 2) { px -= 4; el.style.fontSize = px + "px"; }
        return px;
      }

      function construir() {
        const lineaEl = document.getElementById("linea");
        lineaEl.textContent = linea;
        if (!linea.trim()) { lineaEl.style.display = "none"; document.getElementById("linea-raya").style.display = "none"; }
        ajustar(lineaEl, 104, 64, 2, 1.02);

        const rnd = prng(41), polvo = [];
        const campo = document.getElementById("polvo");
        for (let i = 0; i < 40; i++) {
          const d = document.createElement("div"); d.className = "polvo";
          const sz = 2.5 + rnd() * 6; d.style.width = d.style.height = sz.toFixed(1) + "px";
          d.style.left = (rnd() * 1080).toFixed(0) + "px"; d.style.top = (120 + rnd() * 1750).toFixed(0) + "px";
          d.style.opacity = (0.12 + rnd() * 0.45).toFixed(2);
          if (sz > 6.5) d.style.filter = "blur(2px)";
          d.dataset.dy = (90 + rnd() * 260).toFixed(0); d.dataset.dx = ((rnd() - 0.5) * 90).toFixed(0);
          campo.appendChild(d); polvo.push(d);
        }

        const tl = gsap.timeline({ paused: true });
        const EX = "expo.out";
        const SALIDA = 0.45, tSal = D - SALIDA;

        polvo.forEach((d) => tl.fromTo(d, { x: 0, y: 0 }, { x: +d.dataset.dx, y: -d.dataset.dy, duration: D, ease: "none" }, 0));
        tl.fromTo("#resplandor", { opacity: 0.08, scale: 0.9 }, { opacity: 0.2, scale: 1.05, duration: D, ease: "sine.inOut" }, 0);
        tl.fromTo("#escenario", { scale: 1 }, { scale: 1.03, duration: D, ease: "none" }, 0);

        // Marca: la onda se dibuja y el nombre entra
        const onda = document.getElementById("onda");
        const largo = onda.getTotalLength();
        onda.style.strokeDasharray = largo;
        tl.fromTo(onda, { strokeDashoffset: largo }, { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, 0.05);
        tl.fromTo("#marca-txt", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.7, ease: EX }, 0.3);

        // Frase de cierre
        tl.fromTo("#linea", { opacity: 0, y: 70, scale: 1.08, filter: "blur(16px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.9, ease: "power4.out" }, 0.5);
        tl.fromTo("#linea-raya", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: EX }, 0.95);

        // CTA
        tl.fromTo("#cta", { opacity: 0, y: 80, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "back.out(1.6)" }, 1.25);
        tl.fromTo("#cta-a .clave", { color: "#f0ede8" }, { color: "#e2be72", duration: 0.5, ease: "power2.out" }, 1.75);
        tl.fromTo("#cta-b", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: EX }, 1.75);
        const tLeido = 2.35;

        // Sostenido: brillo que cruza la tarjeta y un latido suave (repeticiones finitas según la duración)
        const sost = Math.max(0.4, tSal - tLeido);
        tl.fromTo("#cta-brillo", { xPercent: -120 }, { xPercent: 420, duration: Math.min(1.3, sost), ease: "power2.inOut" }, tLeido);
        const ciclo = 1.6;
        const reps = Math.max(0, Math.floor(sost / ciclo) - 1);
        if (sost >= ciclo) tl.fromTo("#cta", { scale: 1 }, { scale: 1.025, duration: ciclo / 2, ease: "sine.inOut", yoyo: true, repeat: reps * 2 + 1, immediateRender: false }, tLeido + 0.2);

        tl.to("#escenario", { opacity: 0, y: -50, filter: "blur(10px)", duration: SALIDA, ease: "power3.in" }, tSal);
        window.__timelines["main"] = tl;
      }

      Promise.all([
        document.fonts.load('700 100px "Space Grotesk"'),
        document.fonts.load('600 40px "Plus Jakarta Sans"'),
      ]).then(construir, construir);
    </script>
  </body>
</html>
